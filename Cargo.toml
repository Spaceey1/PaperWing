[profile.release]
opt-level = 3
lto = true
codegen-units = 8
strip = true
panic = "abort"

[package]
name = "paperwing"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
smol = "2.0.2"
compositor_bridge = { path = "./compositor_bridge" }
media = { path = "./media" }
# `default-features = false` on purpose: the `tiny-skia` default gives
# iced_renderer a CPU fallback. The bar is built for the GPU path, so a missing
# adapter fails loudly instead of silently rendering something different.
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "wayland",
    "x11",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "smol",
    "lazy",
    "image",
    "canvas",
] }
iced_layershell = { version = "0.18.1", features = ["unconditional-rendering"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = "0.4.45"
battery = "0.7.8"

native-theme = "0.5.7"
native-theme-iced = "0.5.7"
async-signal = "0.2.14"
font-kit = "0.14.3"
tray_server = { path = "./tray", package = "tray" }
isahc = "2.0.2"
